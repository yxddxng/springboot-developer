plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1' // 스프링 부트 플러그
	id 'io.spring.dependency-management' version '1.1.7' // 스프링 의존성 자동 관리
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

// 지정한 JDK 버전
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// 의존성을 받을 저장소
repositories {
	mavenCentral()
}

// 프로젝트에서 필요한 기능의 의존성
dependencies {
	// 웹 애플리케이션을 만들기 위한 기본 세트이다. @RestController, @GetMapping 같은 Spring MVC 기능, JSON 변환, 그리고 내장 톰캣 서버가 들어 있어서 따로 서버 설치 없이 바로 실행 가능
	implementation 'org.springframework.boot:spring-boot-starter-web' // 추가
	// H2 데이터베이스를 웹 브라우저에서 보고 조작할 수 있는 관리 화면을 붙여준다. 실행 후 localhost:8080/h2-console로 접속해서 테이블 확인, SQL 실행 가능
	implementation 'org.springframework.boot:spring-boot-h2console'
	// DB를 자바 객체로 다루게 해주는 JPA + Hibernate 세트이다. @Entity로 클래스를 테이블과 연결하고 JpaRepositry를 상속하면 save(), findById() 같은 메서드를 SQL 없이 쓸 수 있다
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 반복 코드를 줄여주는 라이브러리이다. @Getter, @Setter, @Builder, @RequiredArgsConstructor 같은 어노테이션을 붙이면 자동으로 코드를 만들어준다.
	compileOnly 'org.projectlombok:lombok'
	// 개발 편의 도구이다. 코드를 수정하면 서버를 자동으로 재시작해주고, 캐시도 꺼줘서 변경 사항이 바로 반영된다. 배포할 땐 빠진다
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	// H2 데이터베이스(인메모리 데이터베이스) 자체이다. 메모리에서 돌아가는 가벼운 DB라 따로 설치할 필요 없이 연습이나 테스트용으로 많이 쓴다.
	runtimeOnly 'com.h2database:h2'
	// lombok의 실제 생성 작업은 annotationProcessor가 담당한다
	annotationProcessor 'org.projectlombok:lombok'
	// @ConfigurationProperties로 만든 설정 클래스를 분석해서, application.properties/yml 작성할 때 IDE 자동완성이 되게 해준다
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// JPA 관련 테스트용 세트이다. @DataJpaTest로 Repository만 빠르게 테스트 할 수 있고, JUnit 같은 기본 테스트 도구도 함께 따라온다
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	// 테스트 코드에서도 Lombok을 쓰기 위한 설정이다. 메인 쪽 설정이 테스트 코드엔 자동 적용되지 않아서 따로 넣어준다
	testCompileOnly 'org.projectlombok:lombok'
	// Gradle이 JUnit5 테스트를 실행할 수 있게 해주는 실행기이다. 최신 Gradle에서는 이걸 명시하라고 요구해서 넣어두는 것이다.
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
